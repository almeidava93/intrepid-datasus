[project]
name = "intrepid-datasus"
version = "0.1.0"
description = "Tools for working with DATASUS SIA/SUS outpatient production data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyreaddbc>=1.1",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
datasus = "intrepid_datasus.cli:app"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
docs = [
    "mkdocs-material>=9.8.1",
    "mkdocs-redirects>=1.2.2,<1.2.3",
    "mkdocstrings[python]>=1.0.8",
]
