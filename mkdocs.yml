site_name: intrepid-datasus
site_url: https://almeidava93.github.io/intrepid-datasus/
site_description: Download and query DATASUS public health data (SIA/SUS and more) with SQL
repo_url: https://github.com/almeidava93/intrepid-datasus
repo_name: almeidava93/intrepid-datasus
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Start:
      - Getting started: getting-started.md
      - Key concepts: concepts.md
      - Fetching data: guide/fetching.md
      - Querying: guide/querying.md
  - Databases:
      - DATASUS databases: databases/index.md
      - SIA (outpatient):
          - Overview: databases/sia/index.md
          - Pitfalls: databases/sia/data-notes.md
          - SQL cookbook: databases/sia/examples.md
          - Joins and double counting: databases/sia/joins.md
          - Production:
              - pa (2008 onward): databases/sia/pa.md
              - pa_legacy (1994–2007): databases/sia/pa_legacy.md
              - bi (BPA Individualizado): databases/sia/bi.md
          - APAC:
              - APAC file types: databases/sia/apac.md
              - am (Medicamentos): databases/sia/am.md
              - aq (Quimioterapia): databases/sia/aq.md
              - ar (Radioterapia): databases/sia/ar.md
              - ad (Laudos Diversos): databases/sia/ad.md
              - atd (Tratamento Dialítico): databases/sia/atd.md
              - an (Nefrologia): databases/sia/an.md
              - amp (Acompanhamento Multiprofissional): databases/sia/amp.md
              - acf (Confecção de Fístula): databases/sia/acf.md
              - abo (Pós-Cirurgia Bariátrica): databases/sia/abo.md
              - ab (Cirurgia Bariátrica): databases/sia/ab.md
          - RAAS:
              - RAAS file types: databases/sia/raas.md
              - ps (Psicossocial): databases/sia/ps.md
              - sad (Atenção Domiciliar): databases/sia/sad.md
  - Reference data:
      - Lookup tables: lookups/index.md
      - SIGTAP tables: lookups/sigtap.md
  - Contributing:
      - Adding a database: contributing/adding-a-database.md
      - Development: contributing/development.md
  - Python API:
      - catalog: reference/catalog.md
      - convert: reference/convert.md
      - store: reference/store.md
      - fetch: reference/fetch.md
      - query: reference/query.md
      - sigtap: reference/sigtap.md
      - dictionary: reference/dictionary.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - redirects:
      redirect_maps:
        fetching.md: guide/fetching.md
        querying.md: guide/querying.md
        data-notes.md: databases/sia/data-notes.md
        development.md: contributing/development.md
        sigtap.md: lookups/sigtap.md
        tables/index.md: databases/sia/index.md
        tables/lookups.md: lookups/index.md
        tables/sigtap.md: lookups/sigtap.md
        tables/ab.md: databases/sia/ab.md
        tables/abo.md: databases/sia/abo.md
        tables/acf.md: databases/sia/acf.md
        tables/ad.md: databases/sia/ad.md
        tables/am.md: databases/sia/am.md
        tables/amp.md: databases/sia/amp.md
        tables/an.md: databases/sia/an.md
        tables/apac.md: databases/sia/apac.md
        tables/aq.md: databases/sia/aq.md
        tables/ar.md: databases/sia/ar.md
        tables/atd.md: databases/sia/atd.md
        tables/bi.md: databases/sia/bi.md
        tables/pa.md: databases/sia/pa.md
        tables/pa_legacy.md: databases/sia/pa_legacy.md
        tables/ps.md: databases/sia/ps.md
        tables/raas.md: databases/sia/raas.md
        tables/sad.md: databases/sia/sad.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
